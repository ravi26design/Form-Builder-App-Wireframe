<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Observatory Forms — Mobile App (Black &amp; White)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== Monochrome tokens ===== */
  --blue:#111111; --blue-d:#000000; --green:#4A4A4A;
  --heading:#0A0A0A; --strong:#1F1F1F; --muted:#6E6E6E; --ph:rgba(31,31,31,.38);
  --surface:#fff; --input:#F7F7F7; --canvas:#EFEFEF;
  --border:#DCDCDC; --border2:#E7E7E7; --divider:#C4C4C4;
  --pending:#8A8A8A; --pending-bg:#F1F1F1; --pending-fg:#565656;
  --error:#000000; --error-bg:#F0F0F0;
  --green-bg:#ECECEC; --blue-bg:#E8E8E8; --purple:#5A5A5A; --purple-bg:#EFEFEF;
  --metric:#141414; --metric-muted:#A8A8A8;
  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:22px;
  --sh-card:0 4px 16px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.05);
  --sh-soft:0 12px 30px rgba(0,0,0,.10);
  --sh-float:0 10px 28px rgba(0,0,0,.20);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;color:var(--strong);
  background:radial-gradient(1200px 700px at 20% 0%,#F2F2F2 0%,#E6E6E6 40%,#D6D6D6 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 12px}

/* ===== Desktop chrome ===== */
.pagehead{text-align:center;max-width:520px;margin-top:6px}
.pagehead h1{font-size:22px;font-weight:800;color:var(--blue);letter-spacing:-.3px}
.pagehead p{font-size:13.5px;color:#4A4A4A;margin-top:6px;line-height:1.5}
.rolebar{display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px;box-shadow:var(--sh-card);margin-top:4px}
.rolebar button{border:none;background:none;font-family:inherit;font-weight:700;font-size:13px;color:var(--blue);
  padding:8px 18px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.rolebar button.on{background:var(--blue);color:#fff}
.rolebar button svg{width:15px;height:15px}

/* ===== Phone frame ===== */
.device{width:392px;height:844px;background:#0B0B0B;border-radius:52px;
  padding:13px;box-shadow:0 40px 90px rgba(23,23,23,.4),0 2px 0 rgba(255,255,255,.15) inset;position:relative;flex:0 0 auto}
.screen{width:100%;height:100%;background:var(--canvas);border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:130px;height:30px;background:#0B0B0B;border-radius:0 0 18px 18px;z-index:60}
.statusbar{height:44px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;
  font-size:13px;font-weight:700;color:var(--heading);z-index:55;position:relative;background:#fff;transition:background .2s}
.statusbar.light{color:#fff;background:var(--blue)}
.statusbar .sr{display:flex;gap:6px;align-items:center}
.statusbar svg{width:16px;height:16px}

/* ===== Viewport / scroller ===== */
.vp{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch;background:var(--canvas)}
.scr.active{display:block;animation:fade .22s ease}
.scr::-webkit-scrollbar{width:0}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pad{padding:16px}
.pb{padding-bottom:40px}

/* ===== Bottom nav ===== */
.bnav{flex:0 0 auto;height:64px;background:#fff;border-top:1px solid var(--border);display:none;align-items:stretch;padding-bottom:4px}
.bnav.show{display:flex}
.bnav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9A9A9A;
  font-size:10.5px;font-weight:600;cursor:pointer;transition:color .15s}
.bnav a svg{width:22px;height:22px}
.bnav a.on{color:var(--blue)}
.bnav a.on::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--blue),#333333)}

/* ===== Typography / helpers ===== */
h1.title{font-size:23px;font-weight:800;color:var(--heading);letter-spacing:-.3px}
.sec-title{font-size:17px;font-weight:700;color:var(--heading)}
.muted{font-size:13px;color:var(--muted);line-height:1.5}
.small{font-size:12px}
.flex{display:flex}.ac{align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.col{flex-direction:column}
.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.grow{flex:1;min-width:0}
.lnk{color:var(--blue);font-weight:700;font-size:13px;cursor:pointer}

/* ===== Card ===== */
.card{background:#fff;border:1px solid var(--border2);border-radius:var(--r-l);box-shadow:var(--sh-card)}
.card.p{padding:16px}
.card.tap{cursor:pointer;transition:transform .1s}.card.tap:active{transform:scale(.985)}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:var(--r-s);font-size:12px;font-weight:700}
.badge .dot{width:7px;height:7px;border-radius:50%}
.b-s{background:var(--green-bg);color:var(--green)}.b-s .dot{background:var(--green)}
.b-p{background:var(--pending-bg);color:var(--pending-fg)}.b-p .dot{background:var(--pending)}
.b-e{background:#F0F1F1;color:var(--muted)}.b-e .dot{background:var(--muted)}
.b-blue{background:var(--blue-bg);color:var(--blue)}.b-blue .dot{background:var(--blue)}

/* ===== Buttons ===== */
.btn{height:46px;border-radius:var(--r-m);padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-family:inherit;font-weight:700;font-size:14.5px;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;transition:.12s}
.btn:active{transform:scale(.98)}
.btn svg{width:17px;height:17px}
.btn-primary{background:linear-gradient(135deg,#2E2E2E,var(--blue));color:#fff;box-shadow:0 6px 16px rgba(66,66,66,.26)}
.btn-green{background:linear-gradient(135deg,#5C5C5C,var(--green));color:#fff;box-shadow:0 6px 16px rgba(120,120,120,.24)}
.btn-outline{background:#fff;border-color:var(--blue);color:var(--blue)}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--strong)}
.btn-danger-g{background:#fff;border-color:#CFCFCF;color:var(--error)}
.btn-sm{height:38px;font-size:13.5px;padding:0 14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ipill{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--border);
  display:grid;place-items:center;color:var(--blue);cursor:pointer}
.ipill svg{width:17px;height:17px}

/* ===== Chips ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;height:38px;padding:0 16px;border-radius:var(--r-m);background:#fff;border:1px solid var(--border);
  display:flex;align-items:center;font-weight:700;font-size:13.5px;color:var(--blue);cursor:pointer;box-shadow:var(--sh-card)}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.selg{background:var(--green);border-color:var(--green);color:#fff}

/* ===== Inputs ===== */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--heading);margin-bottom:7px}
.field label .req{color:var(--error)}
.input{min-height:46px;background:var(--input);border:1px solid rgba(41,41,41,.16);border-radius:var(--r-m);
  padding:0 12px;display:flex;align-items:center;gap:8px;transition:border-color .15s,box-shadow .15s,background .15s}
.input:focus-within{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(66,66,66,.10)}
.input.ro{background:#F5F5F5}
.input input,.input textarea,.input select{border:none;background:transparent;outline:none;font:inherit;color:var(--strong);width:100%;resize:none}
.input textarea{padding:12px 0;min-height:84px}
.input input::placeholder,.input textarea::placeholder{color:var(--ph)}
.input .lead{color:var(--muted);display:flex}.input .lead svg{width:16px;height:16px}
.input .trail{color:var(--muted);cursor:pointer;display:flex}.input .trail svg{width:18px;height:18px}

/* ===== Gradient hero header ===== */
.hero{position:relative;color:#fff;padding:20px 16px 24px;background:var(--blue);
  border-bottom-left-radius:26px;border-bottom-right-radius:26px}
.hero>*{position:relative;z-index:1}
.hero .h-sub{font-size:12.5px;color:#D8D8D8}
.hero .h-name{font-size:21px;font-weight:800}
.mini{flex:1;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.20);border-radius:16px;padding:14px;
  display:flex;gap:11px;align-items:flex-start;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.mini-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.mini-ic svg{width:19px;height:19px}
.mini .l{font-size:12px;color:#D8D8D8;font-weight:700}
.mini .v{font-size:29px;font-weight:800;font-family:'DM Sans',sans-serif;letter-spacing:-.6px;line-height:1.05;margin-top:1px}
.mini .cap{font-size:10.5px;color:rgba(224,224,224,.72);margin-top:3px}

/* ===== Toggle ===== */
.tgl{width:44px;height:26px;border-radius:14px;background:#D4D4D4;position:relative;cursor:pointer;flex:0 0 auto;transition:.15s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgl.on{background:var(--green)}.tgl.on::after{left:21px}

/* ===== Stat grid ===== */
.statg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.statc{background:#fff;border:1px solid var(--border2);border-radius:var(--r-l);box-shadow:var(--sh-card);padding:15px}
.statc .ic{width:42px;height:42px;border-radius:12px;background:var(--blue-bg);display:grid;place-items:center;color:var(--blue);margin-bottom:10px}
.statc .ic svg{width:22px;height:22px}
.statc .v{font-size:25px;font-weight:800;color:var(--metric);font-family:'DM Sans',sans-serif}
.statc .l{font-size:12px;color:var(--muted);margin-top:1px}
.statc .d{font-size:11px;font-weight:700;margin-top:6px}

/* ===== List rows ===== */
.row{padding:14px 0;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:12px}
.row:last-child{border-bottom:none}
.catsq{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
  box-shadow:0 4px 10px rgba(23,23,23,.06);position:relative}
.catsq::after{content:'';position:absolute;inset:0;border-radius:13px;border:1px solid rgba(255,255,255,.6)}
.catsq svg{width:22px;height:22px}
.tt{font-size:15px;font-weight:700;color:var(--heading)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3A3A3A,#000000);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto;position:relative}
.online{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff}
.notifdot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#111111;border:2px solid var(--blue)}
.menudot{width:9px;height:9px;border-radius:50%;background:#111111;flex:0 0 auto}

/* ===== Builder ===== */
.fcard{border:1px solid var(--border2);border-radius:14px;background:#fff;box-shadow:var(--sh-card);padding:14px;margin-bottom:12px;display:flex;gap:10px}
.ficon{width:34px;height:34px;border-radius:9px;background:var(--blue-bg);display:grid;place-items:center;color:var(--blue);flex:0 0 auto}
.ficon svg{width:18px;height:18px}
.fctrl{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.fctrl span{padding:3px;cursor:pointer;display:flex}.fctrl svg{width:16px;height:16px}
.pv-input{margin-top:8px;min-height:38px;border:1px solid rgba(41,41,41,.16);border-radius:10px;background:var(--input);padding:9px 10px;color:var(--ph);font-size:13px}
.pv-opt{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px;color:var(--strong)}
.pv-opt svg{width:15px;height:15px;color:var(--muted)}
.pv-media{margin-top:8px;min-height:62px;border:1px dashed var(--divider);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:4px;font-size:12px}
.pv-media svg{width:20px;height:20px}
.section-band{background:var(--blue-bg);border-radius:12px;padding:13px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.section-band .sl{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--blue)}
.section-band .st{font-size:16px;font-weight:800;color:var(--heading)}

/* ===== Sheet ===== */
.sheet-bd{position:absolute;inset:0;background:rgba(23,23,23,.42);z-index:80;display:none;animation:fade .2s}
.sheet-bd.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:81;
  max-height:78%;display:none;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{display:flex;transform:none}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--divider);margin:10px auto 6px}
.sheet .sh-title{font-size:18px;font-weight:800;color:var(--heading);padding:2px 18px 8px}
.sheet .sh-body{overflow-y:auto;padding:0 18px 24px}
.pgroup{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin:16px 0 8px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ptile{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;padding:11px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--strong)}
.ptile:active{background:#F6F6F6}
.ptile .pi{width:30px;height:30px;border-radius:8px;background:var(--blue-bg);display:grid;place-items:center;color:var(--blue);flex:0 0 auto}
.ptile .pi svg{width:16px;height:16px}

/* ===== Fill / choices ===== */
.qlabel{font-size:20px;font-weight:800;color:var(--heading);line-height:1.3}
.choice{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:14px;cursor:pointer;margin-bottom:10px}
.choice svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
.choice.on{border-color:var(--blue);background:#F3F3F3;box-shadow:0 4px 12px rgba(66,66,66,.12)}
.choice.on svg{color:var(--blue)}
.choice .ct{font-size:15px;color:var(--strong)}
.choice.on .ct{color:var(--blue);font-weight:700}
/* fill-form fields + nested follow-ups */
.fillfield{margin-bottom:18px}
.flabel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.flabel>span:first-child{font-size:14px;font-weight:700;color:var(--heading)}
.ftag{flex:0 0 auto;height:20px;padding:0 8px;border-radius:6px;background:var(--blue-bg);color:var(--blue);
  font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;display:inline-flex;align-items:center}
.fu-wrap{margin:12px 0 2px 4px;padding-left:14px;border-left:2px dashed #C6C6C6}
.fu-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--blue);margin-bottom:10px}
.fu-tag svg{width:14px;height:14px}
.fu-wrap .fillfield:last-child{margin-bottom:0}
.fu-wrap .ftag{background:#E9E9E9}
.fillsec{padding:16px 16px 4px;margin-bottom:14px}
.fillsec-head{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--border2)}
.secnum{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:800;
  display:grid;place-items:center;flex:0 0 auto}
.stars{display:flex;gap:8px}.stars svg{width:38px;height:38px;color:var(--pending);cursor:pointer}
.progtrack{height:6px;background:#E9E9E9;border-radius:9px;overflow:hidden}
.progfill{height:100%;background:linear-gradient(90deg,#333333,var(--blue));border-radius:9px;transition:width .3s}

/* ===== Chart ===== */
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:10px}
.bar{flex:1;background:linear-gradient(180deg,#333333,var(--blue));border-radius:6px 6px 0 0;min-height:6px}
.barlabels{display:flex;gap:8px;margin-top:6px}.barlabels span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.hbar{height:9px;border-radius:6px;background:#ECECEC;overflow:hidden;margin-top:6px}
.hbar>div{height:100%;background:linear-gradient(90deg,var(--green),#6E6E6E);border-radius:6px}

/* ===== Banner ===== */
.banner{border-radius:14px;padding:14px 16px}
.banner.pend{background:var(--pending-bg);border:1px solid #D8D8D8}
.banner.pend .t{color:var(--pending-fg);font-weight:800}
.banner.ok{background:var(--green-bg);border:1px solid #CBCBCB}
.banner.ok .t{color:var(--green);font-weight:800}

/* ===== Toast ===== */
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#0A0A0A;color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;z-index:90;
  transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px}
.toast svg{width:16px;height:16px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* profile settings rows */
.setrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border2);cursor:pointer}
.setrow:last-child{border-bottom:none}
.setrow .si{width:34px;height:34px;border-radius:9px;background:var(--input);display:grid;place-items:center;color:var(--blue)}
.setrow .si svg{width:17px;height:17px}
.chev{color:var(--metric-muted)}.chev svg{width:18px;height:18px}
.hint{color:#8A8A8A;font-size:12px;margin-top:2px}
.faq-q{padding:15px 0;border-bottom:1px solid var(--border2);cursor:pointer}
.faq-a{font-size:13px;color:var(--muted);line-height:1.55;padding-bottom:14px;display:none}
.faq-q.open .faq-a{display:block}

/* ===== Splash ===== */
.splash{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--heading);overflow:hidden}
.splash::before{content:'';position:absolute;width:320px;height:320px;border-radius:50%;top:-130px;right:-110px;background:radial-gradient(circle,rgba(66,66,66,.09),transparent 68%)}
.splash::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;bottom:-130px;left:-110px;background:radial-gradient(circle,rgba(120,120,120,.13),transparent 70%)}
.splash-logo{text-align:center;position:relative;z-index:1;animation:splashFade .7s ease}
.splash-mark{width:92px;height:92px;border-radius:26px;background:linear-gradient(135deg,var(--blue),var(--green));display:grid;place-items:center;color:#fff;margin:0 auto 22px;box-shadow:0 16px 38px rgba(66,66,66,.30);animation:splashPop .6s cubic-bezier(.2,.8,.2,1)}
.splash-mark svg{width:48px;height:48px}
.splash-title{font-size:27px;font-weight:800;letter-spacing:-.3px;color:var(--blue)}
.splash-sub{font-size:13px;font-weight:800;letter-spacing:5px;color:var(--green);margin-top:3px}
.splash-foot{position:absolute;bottom:54px;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.splash-spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(66,66,66,.15);border-top-color:var(--blue);animation:spin .8s linear infinite}
.splash-tag{font-size:12px;color:var(--muted);letter-spacing:.3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes splashPop{0%{transform:scale(.55);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes splashFade{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

/* ==================================================================
   MONOCHROME PASS — state is carried by fill / outline / weight,
   never by hue. Appended last so it wins over the base rules.
   ================================================================== */

/* --- Status badges: solid = done, outlined = in progress, flat = inactive --- */
.badge{border:1px solid transparent}
.b-s{background:#111;color:#fff;border-color:#111}
.b-s .dot{background:#fff}
.b-p{background:#fff;color:#2B2B2B;border-color:#9A9A9A}
.b-p .dot{background:transparent;box-shadow:inset 0 0 0 2px #2B2B2B}
.b-e{background:#F0F0F0;color:#8A8A8A;border-color:#E2E2E2}
.b-e .dot{background:#B5B5B5}
.b-blue{background:#EAEAEA;color:#111;border-color:#DADADA}
.b-blue .dot{background:#111}

/* --- Notification dot has to read on the near-black hero --- */
.notifdot{background:#111;border:2px solid #fff}
.menudot{background:#111}

/* --- Buttons: primary solid black, secondary mid-grey, outlines hairline --- */
.btn-primary{background:#111;box-shadow:0 6px 16px rgba(0,0,0,.20)}
.btn-green{background:#4A4A4A;box-shadow:0 6px 16px rgba(0,0,0,.16)}
.btn-outline{border-color:#111;color:#111}
.btn-ghost{border-color:#D6D6D6;color:#1F1F1F}
.btn-danger-g{border-color:#111;color:#111;border-style:dashed}

/* --- Chips: selected states differ by fill vs. outline-heavy --- */
.chip{border-color:#D8D8D8;color:#1F1F1F}
.chip.sel{background:#111;border-color:#111;color:#fff}
.chip.selg{background:#fff;border-color:#111;color:#111;border-width:2px;padding:0 15px}

/* --- Bars / progress: flat ink, no gradients --- */
.bar{background:#1F1F1F}
.hbar{background:#E6E6E6}
.hbar>div{background:#1F1F1F}
.progfill{background:#111}

/* --- Selected choice: ink border + tint, plus a left rule for redundancy --- */
.choice.on{border-color:#111;border-width:1.5px;background:#F4F4F4;box-shadow:none}

/* --- Hero: flat ink block instead of a brand gradient --- */
/* The hero sits on white like the rest of the headers; the greeting carries
   the hierarchy through weight rather than a block of colour. */
.hero{background:#fff;color:var(--heading);border-bottom:1px solid var(--border);
  border-bottom-left-radius:0;border-bottom-right-radius:0}
.hero .h-sub{color:var(--muted)}
.hero .h-name{color:var(--heading)}
.statusbar.light{background:#111}
.mini{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.26)}

/* --- Splash & avatars --- */
.splash-mark{background:#111;box-shadow:0 16px 38px rgba(0,0,0,.28)}
.splash-sub{color:#6E6E6E}
.avatar{background:#1F1F1F}
.online{background:#fff;box-shadow:inset 0 0 0 2px #111}

/* --- Toggle: on = ink, off = light grey --- */
.tgl{background:#D4D4D4}
.tgl.on{background:#111}

/* --- Section markers & tags --- */
.secnum{background:#111}
.section-band{background:#F0F0F0;border:1px solid #E4E4E4}
.ftag{background:#EDEDED;color:#3A3A3A}
.fu-wrap{border-left-color:#C9C9C9}
.fu-tag{color:#111}

/* --- Banners: keep the meaning through the border pattern --- */
.banner.pend{background:#F4F4F4;border:1px dashed #A9A9A9}
.banner.pend .t{color:#1F1F1F}
.banner.ok{background:#F4F4F4;border:1px solid #111}
.banner.ok .t{color:#111}

/* --- Fill form: attachments, signature pad, validation --- */
.thumb{width:66px;height:66px;border-radius:10px;object-fit:contain;border:1px solid var(--border);flex:0 0 auto;background:#F2F2F2}
.media-done{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}
.sigbox{position:relative;border:1px dashed var(--divider);border-radius:12px;background:#FAFAFA;height:150px;overflow:hidden}
.sigcanvas{width:100%;height:150px;display:block;touch-action:none;cursor:crosshair}
.sighint{position:absolute;inset:0;display:grid;place-items:center;color:var(--metric-muted);font-size:13px;pointer-events:none}
.geolab{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
/* an unanswered required field is called out by weight and a message, never by hue */
.fillfield.err .input,.fillfield.err .pv-media,.fillfield.err .sigbox,.fillfield.err .choice{border-color:#111;border-width:1.5px}
.fillfield.err .input{box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.reqmsg{display:none;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#111;margin-top:7px}
.fillfield.err .reqmsg{display:flex}
.reqmsg svg{width:13px;height:13px}

/* ============ Page header ============
   One row: back arrow, title, and at most one action. No “Back” label and no
   subtitle — the context belongs in the body, where there is room for it.
   Filters sit below the white bar so the header stays a fixed, calm anchor. */
.phead-wrap{background:#fff;border-bottom:1px solid var(--border);padding:12px 14px 14px;flex:0 0 auto}
.phead{display:flex;align-items:center;gap:8px;min-height:40px}
.pback{width:36px;height:36px;margin-left:-6px;border-radius:10px;display:grid;place-items:center;
  color:var(--heading);cursor:pointer;flex:0 0 auto;transition:background .15s}
.pback:active{background:var(--input)}
.pback svg{width:22px;height:22px}
.ptitle{flex:1;min-width:0;font-size:19px;font-weight:800;color:var(--heading);letter-spacing:-.3px;
  line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .ipill,.phead .btn,.phead .badge{flex:0 0 auto}
.phead .lnk{flex:0 0 auto;white-space:nowrap}
.chiprow{padding:14px 16px 0}
.chiprow .chips{padding-bottom:2px}

/* --- The four record counts on a form page: Total = Submitted + Waiting + Draft --- */
.substats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.substats .card{padding:14px}
.substats .sv{font-size:26px;font-weight:800;color:var(--metric);font-family:'DM Sans',sans-serif;line-height:1.1;margin-bottom:2px}

/* --- Tabs that divide the width evenly --- */
.chips.fit{overflow:visible}
.chips.fit .chip{flex:1 1 0;justify-content:center;padding:0 10px;min-width:0}

/* --- Filter button, sized to sit beside the search field --- */
.filterbtn{flex:0 0 auto;width:48px;padding:0;position:relative;height:auto;min-height:46px}
.filterbtn svg{width:19px;height:19px}
.fcount{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:#111;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}

/* --- Step indicator --- */
.stepbar{display:flex;gap:5px;margin-top:14px}
.stepseg{flex:1;height:5px;border-radius:3px;background:#E4E4E4;transition:background .2s}
.stepseg.done{background:#111}
.stepseg.now{background:#8A8A8A}

/* --- Repeatable section entries --- */
.repitem{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;background:#FCFCFC}
.rephead{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--border2)}
.repnum{width:24px;height:24px;border-radius:50%;background:#111;color:#fff;font-size:11.5px;font-weight:800;
  display:grid;place-items:center;flex:0 0 auto}
.repdel{color:var(--muted);cursor:pointer;display:flex;padding:4px}
.repdel svg{width:17px;height:17px}
.repitem .fillfield:last-of-type{margin-bottom:0}

/* --- One-time code boxes --- */
.otpwrap{position:relative;cursor:text}
.otpbox{width:46px;height:56px;border:1px solid rgba(31,31,31,.18);border-radius:12px;background:var(--input);
  display:grid;place-items:center;font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;color:var(--heading);
  transition:border-color .15s,box-shadow .15s,background .15s}
.otpbox.on{border-color:#111;border-width:1.5px;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.otphidden{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;background:transparent;
  color:transparent;caret-color:transparent;font-size:16px;outline:none}
@media (max-width:380px){.otpbox{width:40px;height:50px;font-size:19px}}

/* --- Emoji kept monochrome --- */
.emj{filter:grayscale(1)}

/* --- Stars / ratings --- */
.stars svg{color:#111}

/* --- Bottom nav active state: ink + underline bar --- */
.bnav a{color:#9A9A9A}
.bnav a.on{color:#111}
.bnav a.on::after{background:#111}

/* --- Desktop backdrop behind the phone --- */
body{background:radial-gradient(1200px 700px at 20% 0%,#F4F4F4 0%,#E8E8E8 42%,#D6D6D6 100%)}

/* ============ Device picker ============
   The frame is scaled to fit the window rather than resized, so the app always
   lays out at the device's real CSS width — a 744pt tablet is previewed as a
   tablet, just drawn smaller. */
.devbar{display:flex;gap:4px;background:#fff;border:1px solid #E2E2E2;border-radius:999px;padding:5px;
  box-shadow:0 6px 20px rgba(0,0,0,.07);max-width:96vw;overflow-x:auto}
.devbar::-webkit-scrollbar{height:0}
.devbar button{border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:700;color:#5A5A5A;
  padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
.devbar button:hover{color:#111}
.devbar button.on{background:#111;color:#fff}
.devmeta{font-size:11.5px;color:#7C7C7C;letter-spacing:.2px;font-weight:600}
.stage{position:relative;flex:0 0 auto}
.stage .device{position:absolute;top:0;left:0;transform-origin:top left}
/* punch-hole camera, for the Android frames */
.punch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;
  background:#0B0B0B;z-index:60;box-shadow:0 0 0 2px rgba(255,255,255,.06)}
@media (max-width:520px){.devbar button{padding:7px 11px;font-size:12px}}
</style>
</head>

function subsFor(id){return MYSUBS.filter(s=>s.f===id);}
/* Until a record uploads its badge describes the device (Draft, Waiting to
   sync). Once uploaded it shows the review state an Org Admin sets on the web
   portal: Pending → Verified → Completed. A field user never changes it. */
function recState(r){return r.s==='submitted'?(r.rs||'pending'):r.s;}
function recStateBadge(r){return statusBadge(recState(r));}
/* Submission ID: form initials + year + per-form sequence, e.g. FHA-2026-0003 */
function formCode(fid){
  const f=FORMS.find(x=>x.id===fid);if(!f)return 'REC';
  return f.n.split(/\s+/).filter(w=>/[A-Za-z]/.test(w[0])).map(w=>w[0].toUpperCase()).join('').slice(0,3);
}
(function(){const seq={};MYSUBS.slice().reverse().forEach(r=>{seq[r.f]=(seq[r.f]||0)+1;r.subId=formCode(r.f)+'-2026-'+String(seq[r.f]).padStart(4,'0');});})();
function nextSubId(fid){return formCode(fid)+'-2026-'+String(subsFor(fid).length+1).padStart(4,'0');}
function recLabel(id){return REC_FIELD[id]||'Record';}
function recOne(id){return REC_ONE[id]||'record';}
function recMany(id){return REC_MANY[id]||'records';}
/* newest first, then grouped by record title so repeat visits sit together */
function groupSubs(list){
  const g=[];
  list.forEach(s=>{const hit=g.find(x=>x.rec===s.rec);hit?hit.items.push(s):g.push({rec:s.rec,items:[s]});});
  return g;
}
/* A form is never simply "done" — it holds N records — so the badge reports
   what still needs the user's attention instead of a single form status. */
function recBadge(id){
  const ss=subsFor(id);
  const d=ss.filter(s=>s.s==='draft').length;
  if(d)return `<span class="badge b-p"><span class="dot"></span>${d} draft${d>1?'s':''}</span>`;
  if(ss.length)return `<span class="badge b-s"><span class="dot"></span>${ss.length} submitted</span>`;
  return `<span class="badge b-e"><span class="dot"></span>Not started</span>`;
}
function recSummary(id){
  const ss=subsFor(id);
  if(!ss.length)return `No submissions yet · one per ${recOne(id)}`;
  const n=new Set(ss.map(s=>s.rec)).size;
  return `${ss.length} submission${ss.length>1?'s':''} · ${n} ${n===1?recOne(id):recMany(id)}`;
}

  try{localStorage.setItem('iof-screen',JSON.stringify({id:id,opts:opts||{},role:ROLE,at:Date.now()}));}catch(e){}
  try{if(id!=='splash')history.replaceState(null,'','#'+id);}catch(e){}
}
function restoreScreen(){
  let st=null;
  try{st=JSON.parse(localStorage.getItem('iof-screen')||'null');}catch(e){}
  const hash=(location.hash||'').replace(/^#/,'');
  let id=hash||(st&&st.id)||'';
  if(!id||!SCREENS[id])return false;
  /* a half-finished flow cannot be resumed from storage, so fall back to its parent */
  if(TRANSIENT[id])id=TRANSIENT[id];
  if(st&&st.role)ROLE=st.role;
  const opts=(st&&st.id===id)?st.opts:{};
  nav(id,opts);
  return true;
}

/* ================== FILTERS ==================
   Two filtered lists, one mechanism: Forms filters on programme and status,
   Records adds the form itself. Filters live in a sheet so the list keeps its
   full width, and whatever is applied stays visible as removable chips. */
let formFilter={prog:'',status:''};
let subFilter={prog:'',form:'',status:''};
const FORM_STATUSES=[['','Any status'],['none','Not started'],['draft','Has drafts'],['done','Submitted']];
const SUB_STATUSES=[['','Any status'],['draft','Draft'],['queued','Waiting to sync'],['pending','Pending'],['verified','Verified'],['completed','Completed']];
function fieldPrograms(){return [...new Set(FORMS.filter(f=>f.s==='active').map(f=>f.prog))];}
function filterCount(o){return Object.values(o).filter(Boolean).length;}
/* The filter control sits beside the search, badged with how many filters are
   on; what is actually applied shows as removable chips under the header. */
function filterBtn(which){
  const n=filterCount(which==='forms'?formFilter:subFilter);
  return `<button class="btn ${n?'btn-outline':'btn-ghost'} filterbtn" onclick="openFilters('${which}')">
    <i data-lucide="sliders-horizontal"></i>${n?`<span class="fcount">${n}</span>`:''}</button>`;
}
function filterChips(which){
  const o=which==='forms'?formFilter:subFilter;
  if(!filterCount(o))return '';
  const chip=(label,key)=>`<div class="chip sel" onclick="clearFilter('${which}','${key}')">${label} <i data-lucide="x" style="width:13px;height:13px;margin-left:6px"></i></div>`;
  const chips=[];
  if(o.prog)chips.push(chip(o.prog,'prog'));
  if(o.form)chips.push(chip((FORMS.find(f=>f.id===+o.form)||{}).n||'Form','form'));
  if(o.status)chips.push(chip(statusLabel(which,o.status),'status'));
  return `<div class="chiprow"><div class="chips">${chips.join('')}<div class="chip" onclick="clearFilter('${which}','all')">Clear all</div></div></div>`;
}
function statusLabel(which,v){
  const list=which==='forms'?FORM_STATUSES:SUB_STATUSES;
  const hit=list.find(x=>x[0]===v);return hit?hit[1]:v;
}
function openFilters(which){
  const o=which==='forms'?formFilter:subFilter;
  const opt=(key,val,label,on)=>`<div class="ptile" style="${on?'border-color:#111;border-width:1.5px;font-weight:700':''}" onclick="setFilter('${which}','${key}','${String(val).replace(/'/g,"\\'")}')">${label}</div>`;
  let html=`<div class="pgroup" style="margin-top:4px">Programme</div><div class="pgrid">
      ${opt('prog','','All programmes',!o.prog)}
      ${fieldPrograms().map(p=>opt('prog',p,p,o.prog===p)).join('')}</div>`;
  if(which==='subs'){
    html+=`<div class="pgroup">Form</div><div class="pgrid">
      ${opt('form','','All forms',!o.form)}
      ${FORMS.filter(f=>f.s==='active'&&(!o.prog||f.prog===o.prog)).map(f=>opt('form',f.id,f.n,String(o.form)===String(f.id))).join('')}</div>`;
  }
  const st=which==='forms'?FORM_STATUSES:SUB_STATUSES;
  html+=`<div class="pgroup">Status</div><div class="pgrid">${st.map(x=>opt('status',x[0],x[1],o.status===x[0])).join('')}</div>
    <button class="btn btn-primary btn-block mt16" onclick="closeSheet()"><i data-lucide="check"></i> Show results</button>
    <button class="btn btn-ghost btn-block mt10" onclick="clearFilter('${which}','all')">Clear all filters</button>`;
  $('#sheetTitle').textContent='Filter '+(which==='forms'?'forms':'records');
  $('#sheetBody').innerHTML=html;
  $('#sheetbd').classList.add('show');$('#sheet').classList.add('show');icons();
}
function setFilter(which,key,val){
  const o=which==='forms'?formFilter:subFilter;
  o[key]=val;
  if(which==='subs'&&key==='prog')o.form='';   /* a form filter must belong to the programme */
  nav(which==='forms'?'fu-forms':'fu-subs');
  openFilters(which);
}
function clearFilter(which,key){
  const o=which==='forms'?formFilter:subFilter;
  if(key==='all')Object.keys(o).forEach(k=>o[k]='');else o[key]='';

/* A form matches when it is published, sits in the chosen programme and is in
   the chosen state for this user — a form can hold drafts and submitted
   records at once, so status describes the user's work, not the form. */
function formMatches(f){
  if(f.s!=='active')return false;      /* unpublished forms never reach the field */
  if(formFilter.prog&&f.prog!==formFilter.prog)return false;
  const ss=subsFor(f.id);
  if(formFilter.status==='none')return ss.length===0;
  if(formFilter.status==='draft')return ss.some(s=>s.s==='draft');
  if(formFilter.status==='done')return ss.some(s=>s.s!=='draft');
  return true;
}
function fieldTabMatch(f){return formMatches(f);}
function filterForms(q){
  q=(q||'').toLowerCase();const isField=ROLE==='field';const cur=formsTab[isField?'field':'admin'];
  const list=FORMS.filter(f=>{
    const ok=isField?formMatches(f):(cur==='All'||f.s===cur.toLowerCase());
    return ok && (f.n.toLowerCase().includes(q)||f.prog.toLowerCase().includes(q));
  }).sort((a,b)=>(starred[b.id]||0)-(starred[a.id]||0));

/* ================== READING BACK A RECORD ==================
   A record is shown as the form that produced it: every section, every
   question, in the order it was asked, with the answer given — or a dash
   where the field was left empty. Records made before this device captured
   answers fall back to a representative set so the page is never blank. */
function answersOf(r){
  if(r.ans)return r.ans;
  const seed=r.id||1;
  const pick=(arr)=>arr[seed%arr.length];
  const a={
    name:r.rec,
    notes:pick(['Catchment in good condition, minor silting near the inlet.',
                'Vegetation thinning on the eastern slope; grazing pressure visible.',
                'Site stable since the last visit, no new erosion observed.']),
    depth:String(28+(seed%26)),
    email:'rajesh@indiaobs.org',
    phone:'+91 98450 11223',
    adate:'2026-03-'+String(10+(seed%18)).padStart(2,'0'),
    stime:'2026-03-'+String(10+(seed%18)).padStart(2,'0')+'T09:15',
    veg:String(40+(seed%50)),
    source:pick(['Borewell','Open Well','River / Stream','Pond / Lake']),
    bdepth:String(80+(seed%60)),
    quality:pick(['Clear','Turbid','Coloured']),
    turb:'Medium',
    colr:'Light brown after rain',
    issues:pick([['Seasonal shortage'],['Contamination','Salinity'],['Encroachment'],[]]),
    csrc:'Runoff from the adjoining field',
    enc:'Boundary wall extended about four metres into the catchment.',
    photo:{kind:'photo',name:'site-'+seed+'.jpg',size:284000},
    doc:{kind:'file',name:'lab-report-'+seed+'.pdf',size:96000},
    sign:{kind:'sign'},
    loc:r.gps?{lat:(r.gps.split('°')[0]||'').trim(),lng:(r.gps.split(',')[1]||'').replace(/[^\d.]/g,''),src:'gps',acc:6+(seed%9)}:null,
    area:'Boundary drawn · 4.2 ha',
    url:'https://indiaobs.org/sites/'+String(r.rec||'').toLowerCase().replace(/\s+/g,'-'),
    rating:3+(seed%3),
  };
  /* two household members, so a repeatable section reads back as filled */
  ['1','2'].forEach((n,i)=>{
    a['mname#'+n]=['Asha Devi','Mahesh Rao'][i];
    a['mage#'+n]=['41','17'][i];
    a['mgender#'+n]=['Female','Male'][i];
    a['mphone#'+n]=['+91 99000 12345',''][i];
    a['mrel#'+n]=['Head of household','Son'][i];
  });
  return a;
}
function fmtDate(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));
  if(!m)return String(v||'');
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parseInt(m[3],10)+' '+M[parseInt(m[2],10)-1]+' '+m[1];
}
function answerText(f,v){
  if(v===undefined||v===null||v==='')return '';
  if(Array.isArray(v))return v.length?v.join(', '):'';
  if(typeof v==='object'){
    if(v.lat)return v.lat+'° N, '+v.lng+'° E'+(v.acc?' · ±'+v.acc+' m':'');
    if(v.kind==='sign')return 'Signed';
    if(v.kind==='photo'||v.kind==='file')return (v.name||'Attached')+(v.size?' · '+fmtSize(v.size):'');
    return 'Captured';
  }
  if(f.type==='Date')return fmtDate(v);
  if(f.type==='Date & Time'){const[d,t]=String(v).split('T');return fmtDate(d)+(t?' · '+t:'');}
  if(f.type==='Rating')return v+' / 5';
  if(f.type==='Percentage')return v+'%';
  return String(v);
}
function answerRow(f,v){
  const txt=answerText(f,v);
  const img=(v&&typeof v==='object'&&v.data)?v.data:'';
  return `<div style="padding:11px 0;border-bottom:1px solid var(--border2)">
    <div class="muted small">${f.label}</div>
    ${img?`<img src="${img}" style="max-width:150px;max-height:84px;border:1px solid var(--border);border-radius:10px;margin-top:6px;background:#fff">`
      :`<div style="font-size:15px;font-weight:${txt?700:400};color:${txt?'var(--heading)':'var(--metric-muted)'};margin-top:4px">${txt||'—'}</div>`}
  </div>`;
}
function renderAnswers(r,form){
  const a=answersOf(r);
  const reps=r.reps||{};
  const get=id=>a[id];
  const fieldRows=(f,n)=>{
    const inst=instF(f,n);
    if(f.rec)inst.label=recLabel(form.id);   /* District, Village Name, Plot ID … */
    let out=answerRow(inst,get(inst.id));
    if(f.followups){                      /* a follow-up only shows if it was triggered */
      const val=get(inst.id);
      (Array.isArray(val)?val:[val]).forEach(k=>{
        if(k&&f.followups[k])f.followups[k].forEach(ff=>{out+=fieldRows(ff,n);});
      });
    }
    return out;
  };
  return FILL_SECTIONS.map((sec,si)=>{
    if(sec.repeat){
      const c=reps[si]||Object.keys(a).filter(k=>k.indexOf('mname#')===0).length||sec.repeat.count;
      let body='';
      for(let n=1;n<=c;n++){
        body+=`<div class="repitem" style="background:#fff;margin-bottom:${n===c?0:12}px">
          <div class="rephead"><span class="repnum">${n}</span><div class="grow"><div class="tt" style="font-size:14px">${sec.repeat.label} ${n}</div></div></div>
          ${sec.fields.map(f=>fieldRows(f,n)).join('')}</div>`;
      }
      return `<div class="pgroup" style="margin-top:18px">${sec.title}</div>${body}`;
    }
    return `<div class="pgroup" style="margin-top:18px">${sec.title}</div>
      <div class="card p">${sec.fields.map(f=>fieldRows(f,null)).join('')}</div>`;
  }).join('');
}

/* Each run creates a NEW record — filling a form again never overwrites the
   last one. Pass a record id to reopen an existing draft or submission. */
function openFill(id,subId){
  const form=FORMS.find(x=>x.id===id);
  if(form&&form.s!=='active'){toast('This form is not published yet','lock');return;}
  const existing=subId?MYSUBS.find(x=>x.id===subId):null;
  fill={i:0,step:0,answers:{},formId:id,subId:subId||null,geo:{},geoErr:{},showErr:false,reps:{}};
  FILL_SECTIONS.forEach(function(sec,si){if(sec.repeat)fill.reps[si]=sec.repeat.count;});
  const rf=FILL_SECTIONS[0].fields[0];          /* the record-title field */
  rf.label=recLabel(id);rf.ph='Enter '+recOne(id)+' name';
  if(existing)fill.answers[rf.id]=existing.rec;
  nav('fu-fill');
}

function nowStamp(){
  const d=new Date(),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],p=n=>String(n).padStart(2,'0');
  return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear()+' · '+p(d.getHours())+':'+p(d.getMinutes());
}
/* what the record keeps of an attachment field */
function attachments(){
  const out=[];
  activeFillFields().forEach(f=>{const a=fill.answers[f.id];
    if(a&&typeof a==='object'&&a.kind)out.push({label:f.label,kind:a.kind,name:a.name||'',data:a.data||'',size:a.size||0});});
  return out;
}
function saveDraft(){
  const fields=activeFillFields();
  fill.rec=(fill.answers['name']||'').toString().trim()||('Untitled '+recOne(fill.formId));
  fill.at=nowStamp();fill.mode='draft';
  fill.done=fields.filter(isAnswered).length;fill.total=fields.length;
  const files=attachments();
  const ex=fill.subId?MYSUBS.find(x=>x.id===fill.subId):null;
  const snap=Object.assign({},fill.answers),repsSnap=Object.assign({},fill.reps);
  if(ex){ex.rec=fill.rec;ex.at=fill.at;ex.files=files;ex.s='draft';ex.ans=snap;ex.reps=repsSnap;}
  else{fill.subId=++RECID;MYSUBS.unshift({id:fill.subId,f:fill.formId,rec:fill.rec,at:fill.at,s:'draft',gps:'',files:files,ans:snap,reps:repsSnap});}
  nav('fu-done');
}
function submitFill(){
  /* nothing leaves the device until every required field has an answer */
  const missing=missingRequired();
  if(missing.length){
    for(var si=0;si<FILL_SECTIONS.length;si++){
      if(stepMissing(si).length){fill.step=si;nav('fu-fill');flagMissing(stepMissing(si));return;}
    }
    return;
  }
  const doneFields=activeFillFields();
  fill.rec=(fill.answers['name']||'').toString().trim()||('Untitled '+recOne(fill.formId));
  fill.at=nowStamp();fill.mode='submitted';
  fill.done=doneFields.length;fill.total=doneFields.length;
  fill.subIdShown=fill.subId?(MYSUBS.find(x=>x.id===fill.subId)||{}).subId||nextSubId(fill.formId):nextSubId(fill.formId);
  const files=attachments();
  const ex=fill.subId?MYSUBS.find(x=>x.id===fill.subId):null;
  /* offline-first: a new record is queued on the device, not uploaded yet */
  const geo=activeFillFields().map(f=>fill.answers[f.id]).find(v=>v&&v.lat);
  const gpsTxt=geo?geo.lat+'° N, '+geo.lng+'° E':'';
  const snapshot=Object.assign({},fill.answers);
  const repsSnap=Object.assign({},fill.reps);
  if(ex){ex.rec=fill.rec;ex.at=fill.at;ex.s='queued';ex.gps=gpsTxt||ex.gps;ex.files=files;ex.ans=snapshot;ex.reps=repsSnap;}
  else MYSUBS.unshift({id:++RECID,f:fill.formId,rec:fill.rec,at:fill.at,s:'queued',gps:gpsTxt,subId:fill.subIdShown,files:files,ans:snapshot,reps:repsSnap});
  nav('fu-done');
}
/* The form is filled a section at a time. Each step is small enough to finish
   in one go, and a step cannot be left until its required fields are answered,
   so nothing is discovered to be missing at the very end. */
SCREENS['fu-fill']=()=>{
  statusLight(false);
  const last=FILL_SECTIONS.length-1;
  const step=Math.min(fill.step||0,last);
  return `
  <div style="display:flex;flex-direction:column;height:100%">
    <div style="background:#fff;padding:14px 16px 16px;border-bottom:1px solid var(--border);flex:0 0 auto">
      <div class="flex between ac"><span onclick="nav('fu-detail',{id:${fill.formId}})" style="cursor:pointer"><i data-lucide="x"></i></span>
        <b style="font-size:15px">${fill.subId?'Edit record':'New submission'}</b><span class="lnk" onclick="saveDraft()">Save Draft</span></div>
      <div class="stepbar" id="stepbar">${stepSegments(step)}</div>
    </div>
    <div style="flex:1;overflow-y:auto;background:var(--canvas);padding:16px" id="fillScroll">
      <div id="reqBanner" class="banner pend" style="display:none;margin-bottom:14px">
        <div class="t flex ac g8"><i data-lucide="alert-circle"></i> <span id="reqCount">0</span> required field<span id="reqPlural">s</span> on this step</div>
        <div class="muted mt6">They are marked below — answer them to continue.</div></div>
      <div id="fillbody">${renderStepBody(step)}</div></div>
    <div class="pad" style="flex:0 0 auto;background:#fff;border-top:1px solid var(--border);padding-bottom:24px">
      <div class="flex g10">
        ${step>0?`<button class="btn btn-ghost" style="flex:0 0 46%" onclick="stepBack()"><i data-lucide="arrow-left"></i> Back</button>`:''}
        ${step<last
          ? `<button class="btn btn-primary grow" onclick="stepNext()">Next <i data-lucide="arrow-right"></i></button>`
          : `<button class="btn btn-primary grow" onclick="submitFill()"><i data-lucide="check"></i> Submit Record</button>`}
      </div>
    </div>
  </div>`;
};
/* one segment per section: filled behind you, outlined where you are */
function stepSegments(step){
  return FILL_SECTIONS.map((sec,i)=>`<div class="stepseg ${i<step?'done':i===step?'now':''}"></div>`).join('');
}
function renderStepBody(step){return renderOneSection(FILL_SECTIONS[step],step);}
/* the fields a single step owns, follow-ups and repeat entries included */
function stepFields(si){
  const sec=FILL_SECTIONS[si];var out=[];
  if(sec.repeat){
    const c=repCount(si);
    for(var n=1;n<=c;n++)sec.fields.forEach(function(f){pushWithFollowups(instF(f,n),out);});
  }else sec.fields.forEach(function(f){pushWithFollowups(f,out);});
  return out;
}
function stepMissing(si){return stepFields(si).filter(f=>f.req&&!isAnswered(f));}
function stepNext(){
  const si=fill.step||0;
  const missing=stepMissing(si);
  if(missing.length){flagMissing(missing);return;}
  fill.step=Math.min(si+1,FILL_SECTIONS.length-1);
  fill.showErr=false;
  nav('fu-fill');
}
function stepBack(){
  fill.step=Math.max(0,(fill.step||0)-1);
  fill.showErr=false;
  nav('fu-fill');
}
/* mark what is missing, say how many, and take the user to the first one */
function flagMissing(missing){
  fill.showErr=true;renderFillBody();
  const b=$('#reqBanner');
  if(b){b.style.display='block';
    const c=$('#reqCount');if(c)c.textContent=missing.length;
    const pl=$('#reqPlural');if(pl)pl.textContent=missing.length===1?'':'s';
    icons();}
  const first=document.getElementById('ff_'+missing[0].id);
  if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
  toast(missing.length+' required field'+(missing.length>1?'s':'')+' left','alert-circle');
}
/* One entry of a repeatable section is the same fields under suffixed ids, so
   “Full Name” in entry 2 answers to mname#2 and nothing collides. */
function instF(f,n){
  if(!n)return f;
  const c=Object.assign({},f,{id:f.id+'#'+n});
  if(f.followups){
    const fu={};
    Object.keys(f.followups).forEach(k=>{fu[k]=f.followups[k].map(x=>instF(x,n));});
    c.followups=fu;
  }
  return c;
}
function repCount(si){
  const sec=FILL_SECTIONS[si];
  if(!sec||!sec.repeat)return 0;
  if(fill.reps&&fill.reps[si]!=null)return fill.reps[si];
  return sec.repeat.count;
}
function pushWithFollowups(f,out){
  out.push(f);
  if(f.followups){
    const a=fill.answers[f.id];
    (Array.isArray(a)?a:[a]).forEach(function(k){
      if(k&&f.followups[k])f.followups[k].forEach(function(ff){pushWithFollowups(ff,out);});
    });
  }
}
function activeFillFields(){
  var out=[];
  FILL_SECTIONS.forEach(function(sec,si){
    if(sec.repeat){
      const c=repCount(si);
      for(var n=1;n<=c;n++)sec.fields.forEach(function(f){pushWithFollowups(instF(f,n),out);});
    }else{
      sec.fields.forEach(function(f){pushWithFollowups(f,out);});
    }
  });
  return out;
}
/* every id a field owns, including the ones its follow-ups introduce */
function fieldIds(f){
  var out=[f.id];
  if(f.followups)Object.keys(f.followups).forEach(k=>f.followups[k].forEach(x=>{out=out.concat(fieldIds(x));}));
  return out;
}
function addRep(si){
  const sec=FILL_SECTIONS[si];const c=repCount(si);
  if(c>=sec.repeat.max){toast('Maximum '+sec.repeat.max+' entries','alert-circle');return;}
  fill.reps[si]=c+1;
  renderFillBody();
  toast(sec.repeat.label+' '+(c+1)+' added','plus');
  setTimeout(function(){const el=document.getElementById('rep_'+si+'_'+(c+1));if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},60);
}
/* removing an entry shifts the ones after it up, so numbering never gaps */
function removeRep(si,n){
  const sec=FILL_SECTIONS[si];const c=repCount(si);
  if(c<=sec.repeat.min){toast('At least one entry is required','alert-circle');return;}
  for(var k=n;k<c;k++){
    sec.fields.forEach(function(f){
      fieldIds(f).forEach(function(id){
        const from=id+'#'+(k+1),to=id+'#'+k;
        if(fill.answers[from]!==undefined)fill.answers[to]=fill.answers[from];else delete fill.answers[to];
      });
    });
  }
  sec.fields.forEach(function(f){fieldIds(f).forEach(function(id){delete fill.answers[id+'#'+c];});});
  fill.reps[si]=c-1;
  renderFillBody();
  toast(sec.repeat.label+' removed','trash-2');
}
function isAnswered(f){
  var a=fill.answers[f.id];
  if(Array.isArray(a))return a.length>0;
  if(a&&typeof a==='object')return a.lat!==undefined?(a.lat!==''&&a.lng!==''):!!(a.data||a.name);
  return a!==undefined&&a!==null&&a!=='';
}
function missingRequired(){return activeFillFields().filter(f=>f.req&&!isAnswered(f));}
function clearFieldErr(id){const el=document.getElementById('ff_'+id);if(el)el.classList.remove('err');const b=$('#reqBanner');if(b&&missingRequired().length===0)b.style.display='none';}
function updateFillProgress(){var p=$('#fillProg');if(p){var fields=activeFillFields();var done=fields.filter(isAnswered).length;p.style.width=(fields.length?Math.round(done/fields.length*100):0)+'%';}
  var sb=$('#stepbar');if(sb)sb.innerHTML=stepSegments(Math.min(fill.step||0,FILL_SECTIONS.length-1));
  updateRecChip();}
function renderSection(sec){return sec.fields.map(f=>renderField(f)).join('');}
function renderAllSections(){return FILL_SECTIONS.map(renderOneSection).join('');}
function renderOneSection(sec,i){
    const rep=!!sec.repeat;
    const c=rep?repCount(i):0;
    return `<div class="card fillsec">
    <div class="fillsec-head flex ac g10"><span class="secnum">${i+1}</span>
      <div class="grow flex ac g6 wrap"><div class="sec-title" style="font-size:16px">${sec.title}</div>
        ${rep?'<span class="ftag">REPEATABLE</span>':''}</div></div>
    ${rep?renderRepeatSection(sec,i,c):renderSection(sec)}
  </div>`;
}
function renderRepeatSection(sec,si,c){
  let out='';
  for(let n=1;n<=c;n++){
    out+=`<div class="repitem" id="rep_${si}_${n}">
      <div class="rephead">
        <span class="repnum">${n}</span>
        <div class="grow"><div class="tt" style="font-size:14px">${sec.repeat.label} ${n}</div></div>
        ${c>sec.repeat.min?`<span class="repdel" onclick="removeRep(${si},${n})"><i data-lucide="trash-2"></i></span>`:''}
      </div>
      ${sec.fields.map(f=>renderField(instF(f,n))).join('')}
    </div>`;
  }
  out+=`<button class="btn btn-ghost btn-block mt4" style="border-style:dashed" onclick="addRep(${si})">
    <i data-lucide="plus"></i> Add another ${sec.repeat.label.toLowerCase()}</button>`;
  return out;
}
function renderFillBody(){var el=$('#fillbody');if(el){el.innerHTML=renderStepBody(Math.min(fill.step||0,FILL_SECTIONS.length-1));icons();bindSignatures();updateFillProgress();}}
function renderField(f){
  const a=fill.answers[f.id];
  let fu='';
  if(f.followups){
    if(Array.isArray(a)){a.forEach(function(opt){if(f.followups[opt])fu+=renderFuBlock(opt,f.followups[opt]);});}
    else if(a&&f.followups[a]){fu+=renderFuBlock(a,f.followups[a]);}
  }
  const bad=fill.showErr&&f.req&&!isAnswered(f);
  return `<div class="fillfield${bad?' err':''}" id="ff_${f.id}">
    <div class="flabel"><span>${f.label}${f.req?' <span style="color:var(--error)">*</span>':''}</span><span class="ftag">${f.rec?'RECORD TITLE':f.type}</span></div>
    ${f.rec?`<div class="hint flex ac g6" style="margin:-2px 0 8px"><i data-lucide="bookmark" style="width:13px;height:13px"></i> Names this record in your submissions list</div>`:''}
    ${fieldControl(f,a)}
    <div class="reqmsg"><i data-lucide="alert-circle"></i> This field is required</div>${fu}
  </div>`;
}
function renderFuBlock(opt,fields){
  return `<div class="fu-wrap"><div class="fu-tag"><i data-lucide="corner-down-right"></i> Follow-up · shown for “${opt}”</div>${fields.map(f=>renderField(f)).join('')}</div>`;
}
function inp(f,a,type,lead,mode){return `<div class="input">${lead?`<span class="lead"><i data-lucide="${lead}"></i></span>`:''}<input type="${type}"${mode?` inputmode="${mode}"`:''} placeholder="${f.ph||''}" value="${a==null?'':esc(String(a))}" oninput="setAns('${f.id}',this.value)"></div>`;}

/* ---------- attachments: camera, library, files ---------- */
function fileBtn(id,kind,capture,label,icon,cls){
  const accept=kind==='photo'?'image/*':'.pdf,.doc,.docx,.xls,.xlsx,.csv,image/*';
  return `<label class="btn ${cls}" style="cursor:pointer;position:relative;overflow:hidden">
    <i data-lucide="${icon}"></i> ${label}
    <input type="file" accept="${accept}"${capture?' capture="environment"':''} style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer" onchange="pickFile('${id}','${kind}',this)">
  </label>`;
}
function fmtSize(n){if(!n)return '';return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
/* a photo is read into the record so it travels with the submission */
function pickFile(id,kind,el){
  const file=el.files&&el.files[0];if(!file)return;
  if(kind==='photo'){
    const r=new FileReader();
    r.onload=e=>{fill.answers[id]={kind:'photo',name:file.name,size:file.size,data:e.target.result,at:nowStamp()};renderFillBody();toast('Photo attached','camera');};
    r.readAsDataURL(file);
  }else{
    fill.answers[id]={kind:'file',name:file.name,size:file.size,at:nowStamp()};renderFillBody();toast('File attached','paperclip');
  }
}
function removeAns(id){delete fill.answers[id];renderFillBody();}

/* ---------- location: device GPS with a manual fallback ---------- */
function captureGPS(id){
  fill.geo[id]='pending';renderFillBody();
  if(!navigator.geolocation){fill.geo[id]='error';fill.geoErr[id]='This device has no GPS';renderFillBody();return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{fill.geo[id]='ok';
      fill.answers[id]={lat:pos.coords.latitude.toFixed(5),lng:pos.coords.longitude.toFixed(5),acc:Math.round(pos.coords.accuracy||0),src:'gps'};
      renderFillBody();toast('Location captured','map-pin');},
    err=>{fill.geo[id]='error';
      fill.geoErr[id]=err.code===1?'Location permission denied':err.code===3?'GPS timed out':'Position unavailable';
      renderFillBody();},
    {enableHighAccuracy:true,timeout:10000,maximumAge:0}
  );
}
function manualGeo(id){fill.geo[id]='manual';renderFillBody();}
function setGeoPart(id,k,v){
  const cur=(fill.answers[id]&&typeof fill.answers[id]==='object')?fill.answers[id]:{lat:'',lng:''};
  cur[k]=v;cur.src='manual';delete cur.acc;
  fill.answers[id]=cur;clearFieldErr(id);updateFillProgress();
}

/* ---------- signature: finger drawing, stored as a PNG ---------- */
function bindSignatures(){
  document.querySelectorAll('canvas[data-sig]').forEach(function(cv){
    if(cv._bound)return;cv._bound=true;
    const id=cv.getAttribute('data-sig');
    const ctx=cv.getContext('2d');
    const w=cv.clientWidth||300,h=cv.clientHeight||150;
    cv.width=w*2;cv.height=h*2;ctx.scale(2,2);
    ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
    const cur=fill.answers[id];
    if(cur&&cur.data){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,w,h);img.src=cur.data;}
    let drawing=false,last=null,dirty=false;
    const pt=e=>{
      const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
      const k=r.width?((cv.clientWidth||r.width)/r.width):1;   /* undo the device scale */
      return{x:(t.clientX-r.left)*k,y:(t.clientY-r.top)*k};
    };
    const start=e=>{e.preventDefault();drawing=true;last=pt(e);const hint=document.getElementById('sigo_'+id);if(hint)hint.style.display='none';};
    const move=e=>{if(!drawing)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;dirty=true;};
    const end=()=>{if(!drawing)return;drawing=false;
      if(dirty){fill.answers[id]={kind:'sign',data:cv.toDataURL('image/png'),at:nowStamp()};clearFieldErr(id);updateFillProgress();
        const lbl=document.getElementById('sigh_'+id);if(lbl)lbl.textContent='Signature captured · '+fill.answers[id].at;}};
    cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
    cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
  });
}
function clearSig(id){
  const cv=document.querySelector('canvas[data-sig="'+id+'"]');
  if(cv){const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);}
  delete fill.answers[id];updateFillProgress();
  const lbl=document.getElementById('sigh_'+id);if(lbl)lbl.textContent='Sign inside the box';
  const hint=document.getElementById('sigo_'+id);if(hint)hint.style.display='';
}

function fieldControl(f,a){
  switch(f.type){
    case 'Short Text':return inp(f,a,'text');
    case 'Email':return inp(f,a,'email','mail','email');
    case 'Phone':return inp(f,a,'tel','phone','tel');
    case 'Number':return inp(f,a,'number',null,'decimal');
    case 'Website URL':return inp(f,a,'url','link','url');
    case 'Percentage':return `<div class="input"><input type="number" inputmode="decimal" min="0" max="100" placeholder="${f.ph||''}" value="${a==null?'':a}" oninput="setAns('${f.id}',this.value)"><span class="trail" style="color:var(--muted);font-weight:700">%</span></div>`;
    case 'Long Text':return `<div class="input"><textarea placeholder="${f.ph||''}" oninput="setAns('${f.id}',this.value)">${a?esc(String(a)):''}</textarea></div>`;
    case 'Date':return `<div class="input"><span class="lead"><i data-lucide="calendar"></i></span><input type="date" value="${a||''}" oninput="setAns('${f.id}',this.value)"></div>`;
    case 'Date & Time':return `<div class="input"><span class="lead"><i data-lucide="clock"></i></span><input type="datetime-local" value="${a||''}" oninput="setAns('${f.id}',this.value)"></div>`;
    case 'Dropdown':return `<div class="input"><select onchange="setAns('${f.id}',this.value,true)" style="border:none;background:transparent;outline:none;width:100%;font:inherit;-webkit-appearance:none;appearance:none;color:${a?'var(--strong)':'var(--ph)'}"><option value="" ${a?'':'selected'} disabled>Select an option</option>${f.opts.map(o=>`<option ${a===o?'selected':''}>${o}</option>`).join('')}</select><span class="trail"><i data-lucide="chevron-down"></i></span></div>`;
    case 'Multiple Choice':return f.opts.map(o=>`<div class="choice ${a===o?'on':''}" onclick="setAns('${f.id}','${o}',true)"><i data-lucide="${a===o?'circle-dot':'circle'}"></i><span class="ct">${o}</span></div>`).join('');
    case 'Checkboxes':{const arr=Array.isArray(a)?a:[];return f.opts.map(o=>`<div class="choice ${arr.includes(o)?'on':''}" onclick="toggleCheck('${f.id}','${o}')"><i data-lucide="${arr.includes(o)?'check-square':'square'}"></i><span class="ct">${o}</span></div>`).join('');}
    case 'Rating':return `<div class="stars">${[1,2,3,4,5].map(n=>`<span onclick="setAns('${f.id}',${n},true)"><i data-lucide="star" ${(a>=n)?'fill="currentColor"':''}></i></span>`).join('')}</div>`;

    case 'Photo Upload':
      if(a&&a.data)return `<div class="media-done">
        <img src="${a.data}" class="thumb" alt="">
        <div class="grow"><div class="tt" style="font-size:13.5px">Photo attached</div>
          <div class="muted small mt4">${esc(a.name||'photo.jpg')}${a.size?' · '+fmtSize(a.size):''}</div>
          <div class="flex g8 mt10">${fileBtn(f.id,'photo',true,'Retake','camera','btn-ghost btn-sm')}<button class="btn btn-ghost btn-sm" onclick="removeAns('${f.id}')"><i data-lucide="trash-2"></i> Remove</button></div>
        </div></div>`;
      return `<div class="pv-media" style="min-height:130px;padding:14px 12px">
        <i data-lucide="camera"></i><span>Take a photo, or pick one from the library</span>
        <div class="flex g8 mt10" style="width:100%">${fileBtn(f.id,'photo',true,'Camera','camera','btn-outline btn-sm grow')}${fileBtn(f.id,'photo',false,'Library','image','btn-ghost btn-sm grow')}</div></div>`;

    case 'File Upload':
      if(a&&a.kind==='file')return `<div class="media-done">
        <span class="thumb" style="display:grid;place-items:center"><i data-lucide="file-text" style="width:24px;height:24px;color:var(--muted)"></i></span>
        <div class="grow"><div class="tt" style="font-size:13.5px">${esc(a.name)}</div><div class="muted small mt4">${fmtSize(a.size)} · attached ${a.at}</div>
          <div class="flex g8 mt10">${fileBtn(f.id,'file',false,'Replace','upload','btn-ghost btn-sm')}<button class="btn btn-ghost btn-sm" onclick="removeAns('${f.id}')"><i data-lucide="trash-2"></i> Remove</button></div>
        </div></div>`;
      return `<div class="pv-media" style="min-height:120px;padding:14px 12px"><i data-lucide="upload-cloud"></i><span>PDF, document, spreadsheet or image</span>
        <div class="flex g8 mt10" style="width:100%">${fileBtn(f.id,'file',false,'Choose file','upload','btn-outline btn-sm grow')}</div></div>`;

    case 'Signature':
      return `<div class="sigbox"><canvas data-sig="${f.id}" class="sigcanvas"></canvas>
        <div class="sighint" id="sigo_${f.id}" ${(a&&a.data)?'style="display:none"':''}>Sign here with your finger</div></div>
      <div class="flex between ac mt8"><span class="muted small" id="sigh_${f.id}">${(a&&a.data)?'Signature captured · '+a.at:'Sign inside the box'}</span>
        <span class="lnk" onclick="clearSig('${f.id}')">Clear</span></div>`;

    case 'Location':{
      const st=fill.geo[f.id];
      if(a&&a.lat&&a.lng&&st!=='manual')return `<div class="card p" style="box-shadow:none;border-color:var(--border)">
        <div class="flex between ac"><span class="badge b-s"><span class="dot"></span>${a.src==='gps'?'GPS locked':'Entered manually'}</span>
          ${a.acc?`<span class="muted small">accuracy ±${a.acc} m</span>`:''}</div>
        <div class="flex g12 mt12">
          <div class="grow"><div class="geolab">Latitude</div><div class="tt" style="font-size:15px">${a.lat}</div></div>
          <div class="grow"><div class="geolab">Longitude</div><div class="tt" style="font-size:15px">${a.lng}</div></div>
        </div>

      if(st==='pending')return `<button class="btn btn-outline btn-block" disabled><i data-lucide="loader"></i> Requesting GPS permission…</button>`;

          <div class="grow"><div class="geolab">Latitude</div><div class="input"><input type="number" inputmode="decimal" placeholder="13.22570" value="${(a&&a.lat)||''}" oninput="setGeoPart('${f.id}','lat',this.value)"></div></div>
          <div class="grow"><div class="geolab">Longitude</div><div class="input"><input type="number" inputmode="decimal" placeholder="76.01190" value="${(a&&a.lng)||''}" oninput="setGeoPart('${f.id}','lng',this.value)"></div></div>
        </div>
        <button class="btn btn-ghost btn-sm btn-block mt10" onclick="captureGPS('${f.id}')"><i data-lucide="navigation"></i> Try GPS again</button></div>`;
      return `<div><button class="btn btn-outline btn-block" onclick="captureGPS('${f.id}')"><i data-lucide="navigation"></i> Use current location</button>
        <div class="hint" style="text-align:center;margin-top:8px">No signal? <span class="lnk" onclick="manualGeo('${f.id}')">Enter coordinates manually</span></div></div>`;
    }

    case 'Map Data':return `<div class="pv-media" style="min-height:120px;cursor:pointer;${a?'background:var(--green-bg);border-color:#CBCBCB':'background:#F1F1F1'}" onclick="setAns('${f.id}','Boundary drawn · 4.2 ha',true)"><i data-lucide="${a?'check-circle-2':'map'}" style="color:${a?'var(--green)':'var(--blue)'}"></i><span style="color:${a?'var(--green)':'var(--muted)'}">${a?a:'Tap to draw the area boundary on the map'}</span></div>`;
    default:return inp(f,a,'text');
  }
}

  </div>
  <div class="chiprow"><div class="chips fit">

  </div></div>
  <div class="pad pb">
    <div class="flex between ac"><div class="setrow" style="border:none;padding:0;cursor:default"><span>Auto-sync on Wi-Fi</span></div><div class="tgl ${autoSync?'on':''}" onclick="autoSync=!autoSync;nav('fu-sync');toast(autoSync?'Auto-sync on':'Auto-sync off')"></div></div>

    ${queued.length?queued.map(r=>`<div class="card p mt12">

      <button class="btn btn-outline btn-sm btn-block mt12" onclick="syncOne(${r.id})"><i data-lucide="cloud-upload"></i> Sync now</button></div>`).join('')
    :emptyState('Nothing waiting','Everything finished on this device has been uploaded.','check-circle-2')}
    ${queued.length?`<button class="btn btn-green btn-block mt16" onclick="syncAll()"><i data-lucide="cloud-upload"></i> Sync All (${queued.length})</button>`:''}
    `:`
    ${drafts.length?drafts.map(r=>`<div class="card p mt12">
      <div class="flex between g8" style="align-items:flex-start"><div class="grow">
        <div class="tt" style="font-size:14px">${r.rec}</div>

    `}
  </div>`;
};

function renderBuilderFields(){
  if(!builder.fields.length)return `<div class="card p" style="text-align:center;padding:40px 20px;border-style:dashed"><i data-lucide="file-text" style="width:38px;height:38px;color:var(--metric-muted)"></i><div class="sec-title mt12">Start building your form</div><div class="muted mt6">Tap “Add Field” to place questions and sections.</div></div>`;
  return builder.fields.map((f,i)=>{
    const ctrls=`<div class="fctrl"><span onclick="moveField(${i},-1)"><i data-lucide="chevron-up"></i></span><span onclick="moveField(${i},1)"><i data-lucide="chevron-down"></i></span><span style="color:var(--error)" onclick="delField(${i})"><i data-lucide="trash-2"></i></span></div>`;
    if(f.section)return `<div class="section-band"><div class="grow">
      <div class="sl">SECTION</div><div class="st">${esc(f.label)}</div>
      <div class="flex ac g6 mt6 wrap">

          :'<span class="muted small">Asked once</span>'}

      </div></div>${ctrls}</div>`;

    const recBtn=`<span onclick="setRecField(${i})" style="color:${f.rec?'var(--blue)':'var(--metric-muted)'}"><i data-lucide="bookmark"${f.rec?' fill="currentColor"':''}></i></span>`;

      <div class="grow"><div class="flex ac g6 wrap"><span class="tt" style="font-size:14px">${esc(f.label)}</span>${f.req?'<span style="color:var(--error);font-weight:800">*</span>':''}${f.rec?'<span class="ftag">RECORD TITLE</span>':''}</div>

function fieldPreview(f){
  if(['Dropdown','Multiple Choice','Checkboxes'].includes(f.type)&&f.opts)return `<div style="margin-top:6px">${f.opts.slice(0,3).map(o=>`<div class="pv-opt"><i data-lucide="${f.type==='Checkboxes'?'square':f.type==='Dropdown'?'minus':'circle'}"></i>${esc(o)}</div>`).join('')}</div>`;
  if(f.type==='Rating')return `<div style="margin-top:8px;color:var(--pending)">${'<i data-lucide=star style="width:18px;height:18px"></i>'.repeat(5)}</div>`;
  if(['Photo Upload','File Upload','Signature'].includes(f.type))return `<div class="pv-media"><i data-lucide="${f.type==='Signature'?'pen-tool':'upload-cloud'}"></i>${f.type==='Signature'?'Sign here':'Upload / capture'}</div>`;
  return `<div class="pv-input">${esc(f.ph||'Enter value')}</div>`;
}
function addField(type){
  const base={type,label:'New '+type,ph:'Enter value',req:false,section:type==='Section'};
  if(['Dropdown','Multiple Choice','Checkboxes'].includes(type))base.opts=['Option 1','Option 2','Option 3'];
  if(type==='Section')base.label='New Section';

  if(!base.section&&!builder.fields.some(f=>f.rec))base.rec=true;
  builder.fields.push(base);closeSheet();nav('ad-builder');toast(type+' added','plus');
}
/* A repeatable section asks the same questions once per person, plot or visit.
   The count here is the starting number; whoever fills the form can add more. */
function openRepeatSheet(i){
  const f=builder.fields[i];if(!f||!f.section)return;
  const r=f.repeat||{count:3,min:1,max:25,label:'Entry'};
  $('#sheetTitle').textContent='Repeatable section';
  $('#sheetBody').innerHTML=`
    <div class="muted" style="font-size:14px;line-height:1.6">“${esc(f.label)}” can be captured once, or repeated — one copy per family member, plot or visit.</div>
    <div class="flex between ac mt16" style="padding:12px 0;border-top:1px solid var(--border2);border-bottom:1px solid var(--border2)">
      <div class="grow"><div class="tt" style="font-size:14px">Repeat this section</div>
        <div class="hint">Each copy collects the same fields.</div></div>
      <div class="tgl ${f.repeat?'on':''}" onclick="toggleRepeat(${i})"></div>
    </div>
    ${f.repeat?`
    <div class="field mt16"><label>What is each copy called?</label>
      <div class="input"><input value="${esc(r.label)}" placeholder="Family Member" oninput="builder.fields[${i}].repeat.label=this.value||'Entry'"></div>
      <div class="hint">Entries are headed “${esc(r.label)} 1”, “${esc(r.label)} 2”, and so on.</div></div>
    <div class="field" style="margin-bottom:0"><label>How many to start with?</label>
      <div class="flex ac g12">
        <button class="btn btn-ghost btn-sm" onclick="bumpRepeat(${i},-1)" style="width:46px"><i data-lucide="minus"></i></button>
        <div style="flex:1;text-align:center"><div style="font-size:30px;font-weight:800;color:var(--metric);font-family:'DM Sans',sans-serif">${r.count}</div>
          <div class="muted small">copies shown initially</div></div>
        <button class="btn btn-ghost btn-sm" onclick="bumpRepeat(${i},1)" style="width:46px"><i data-lucide="plus"></i></button>
      </div></div>
    <div class="banner ok mt16" style="border-style:dashed"><div class="t flex ac g8"><i data-lucide="info"></i> The field user can add more</div>
      <div class="muted mt6">If a household has 8 members and this starts at ${r.count}, they tap “Add another ${esc(r.label.toLowerCase())}” until all 8 are entered.</div></div>`:''}
    <button class="btn btn-primary btn-block mt16" onclick="closeSheet()"><i data-lucide="check"></i> Done</button>`;
  $('#sheetbd').classList.add('show');$('#sheet').classList.add('show');icons();
}
function toggleRepeat(i){
  const f=builder.fields[i];
  f.repeat=f.repeat?null:{count:3,min:1,max:25,label:'Entry'};
  nav('ad-builder');openRepeatSheet(i);
  toast(f.repeat?'Section repeats':'Section asked once','repeat');
}
function bumpRepeat(i,d){
  const f=builder.fields[i];if(!f.repeat)return;
  f.repeat.count=Math.max(1,Math.min(f.repeat.max,f.repeat.count+d));
  nav('ad-builder');openRepeatSheet(i);
}

function setRecField(i){
  const f=builder.fields[i];if(!f||f.section)return;

let cpw={cur:'',nw:'',cf:''};
const CPW_RULES=['At least 8 characters','Upper & lower case letters','At least one number','At least one symbol'];
SCREENS['changepw']=()=>{
  statusLight(false);
  cpw={cur:'',nw:'',cf:''};
  return `
  <div class="phead-wrap">
    <div class="phead"><span class="pback" onclick="nav('fu-profile')"><i data-lucide="arrow-left"></i></span><h1 class="ptitle">Change Password</h1></div>
  </div>
  <div class="pad pb">
    <div class="card p">
      <div class="field"><label>Current Password</label><div class="input"><span class="lead"><i data-lucide="lock"></i></span><input type="password" placeholder="Enter current password" oninput="cpwSet('cur',this.value)"><span class="trail" onclick="togglePw(this)"><i data-lucide="eye-off"></i></span></div></div>
      <div class="field"><label>New Password</label><div class="input"><span class="lead"><i data-lucide="lock-keyhole"></i></span><input type="password" placeholder="At least 8 characters" oninput="cpwSet('nw',this.value)"><span class="trail" onclick="togglePw(this)"><i data-lucide="eye-off"></i></span></div>
        <div class="flex ac g8 mt8"><div class="progtrack grow"><div class="progfill" id="pwbar" style="width:0%;background:var(--error)"></div></div><span class="small" id="pwlbl" style="font-weight:700;min-width:56px;text-align:right;color:var(--muted)"></span></div>
      </div>
      <div class="field" style="margin-bottom:0"><label>Confirm New Password</label><div class="input"><span class="lead"><i data-lucide="lock-keyhole"></i></span><input type="password" placeholder="Re-enter new password" oninput="cpwSet('cf',this.value)"><span class="trail" onclick="togglePw(this)"><i data-lucide="eye-off"></i></span></div>
        <div class="small mt6 flex ac g6" id="cpwMatch" style="color:var(--error);display:none"><i data-lucide="alert-circle" style="width:14px;height:14px"></i> Passwords do not match</div>
      </div>
    </div>
    <div class="card p mt14" style="background:#FAFAFA">
      <div class="small" style="font-weight:700;color:var(--heading);margin-bottom:6px">Password must contain</div>
      ${CPW_RULES.map((r,i)=>`<div class="flex ac g8" id="pwreq${i}" style="padding:5px 0;color:var(--muted);font-size:13px"><i data-lucide="circle" style="width:15px;height:15px"></i> <span>${r}</span></div>`).join('')}
    </div>
    <button class="btn btn-primary btn-block mt16" id="cpwBtn" disabled onclick="cpwSubmit()"><i data-lucide="shield-check"></i> Update Password</button>
  </div>`;
};
function cpwRules(p){return [p.length>=8, /[a-z]/.test(p)&&/[A-Z]/.test(p), /\d/.test(p), /[^A-Za-z0-9]/.test(p)];}
function cpwSet(k,v){cpw[k]=v;cpwStrength();cpwValidate();}
function cpwStrength(){
  var p=cpw.nw||'';var rules=cpwRules(p);var s=rules.filter(Boolean).length;
  var pct=p?[8,25,50,75,100][s]:0;
  /* mono ramp: darker = stronger */
  var col=s<=1?'#B5B5B5':s===2?'#8A8A8A':s===3?'#5A5A5A':'#111111';
  var bar=$('#pwbar');if(bar){bar.style.width=pct+'%';bar.style.background=col;}
  var l=$('#pwlbl');if(l){l.textContent=p?['','Weak','Fair','Good','Strong'][s]:'';l.style.color=col;}
  rules.forEach(function(ok,i){var el=$('#pwreq'+i);if(el){el.style.color=ok?'var(--green)':'var(--muted)';el.innerHTML=`<i data-lucide="${ok?'check-circle-2':'circle'}" style="width:15px;height:15px"></i> <span>${CPW_RULES[i]}</span>`;}});
  icons();
}
function cpwValidate(){
  var m=$('#cpwMatch');if(m)m.style.display=(cpw.cf&&cpw.nw!==cpw.cf)?'':'none';
  var b=$('#cpwBtn');if(b)b.disabled=!(cpw.cur&&cpw.nw.length>=8&&cpw.nw===cpw.cf);
}
function cpwSubmit(){
  if(!(cpw.cur&&cpw.nw.length>=8&&cpw.nw===cpw.cf)){toast('Please complete all fields correctly');return;}
  cpw={cur:'',nw:'',cf:''};
  toast('Password updated successfully','check-circle-2');
  setTimeout(function(){nav('fu-profile');},700);
}

function helpSearch(v){helpQ=v||'';const el=$('#helpBody');if(el){el.innerHTML=helpBody();icons();}}
function helpBody(){
  const q=helpQ.trim().toLowerCase();
  if(q){
    const faqs=FAQ.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q));
    const arts=GUIDE_ALL.filter(x=>(x.t+' '+x.sum+' '+x.cat).toLowerCase().includes(q));

}
function setDevice(id){
  deviceId=id;
  try{localStorage.setItem('iof-device',id);}catch(e){}
  renderDevBar();applyDevice();
}
function applyDevice(){
  const d=DEVICES.find(x=>x.id===deviceId)||DEVICES[0];
  const dev=document.getElementById('device'),stage=document.getElementById('stage'),notch=document.getElementById('notch');
  dev.style.width=d.w+'px';dev.style.height=d.h+'px';
  dev.style.borderRadius=d.r+'px';dev.style.padding=d.pad+'px';
  dev.querySelector('.screen').style.borderRadius=Math.max(10,d.r-12)+'px';
  notch.className=d.cam==='notch'?'notch':d.cam==='punch'?'punch':'';
  notch.style.display=d.cam==='none'?'none':'';
  /* scale to whatever room the window leaves, never past 1:1 */
  const availH=window.innerHeight-150,availW=window.innerWidth-32;
  const sc=Math.min(1,availH/d.h,availW/d.w);
  dev.style.transform='scale('+sc+')';
  stage.style.width=(d.w*sc)+'px';stage.style.height=(d.h*sc)+'px';
  document.getElementById('devmeta').textContent=d.label+' · '+d.w+' × '+d.h+' pt'+(sc<0.999?' · shown at '+Math.round(sc*100)+'%':'');
}
window.addEventListener('resize',applyDevice);
renderDevBar();applyDevice();

/* ============================ CLOCK ============================ */
function tick(){const d=new Date();let h=d.getHours(),m=d.getMinutes();$('#clock').textContent=((h%12)||12)+':'+(m<10?'0':'')+m;}
setInterval(tick,10000);tick();

/* ---- SPLASH ---- */
SCREENS['splash']=()=>{
  statusLight(false);
  setTimeout(function(){if(curScreen==='splash')nav('login');},2200);
  return `
  <div class="splash">
    <div class="splash-logo">
      <div class="splash-mark"><i data-lucide="leaf"></i></div>
      <div class="splash-title">India Observatory</div>
      <div class="splash-sub">FORMS</div>
    </div>
    <div class="splash-foot">
      <div class="splash-spin"></div>
      <div class="splash-tag">Conservation data collection</div>
    </div>
  </div>`;
};

/* ============================ BOOT ============================ */
if(!restoreScreen())nav('splash');
